services:
  db:
    image: pgvector/pgvector:pg16
    # Give Postgres time to checkpoint and shut down cleanly on stop/down,
    # so it isn't SIGKILLed mid-WAL (default grace is 10s).
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates scout_test database on first container startup.
      # The scout_test DB uses the same schema as scout but is
      # used exclusively by integration tests so test data never
      # contaminates the main database.
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    environment:
      # Override the host-oriented DATABASE_URL from .env: inside the compose
      # network the DB is reached at service name "db" on the in-container port
      # 5432 (not the host-published 5438).
      DATABASE_URL: postgresql+psycopg2://scout:${DB_PASSWORD}@db:5432/scout
      TEST_DATABASE_URL: postgresql+psycopg2://scout:${DB_PASSWORD}@db:5432/scout_test
    ports:
      - "8000:8000"
    volumes:
      # Persisted file cache for all data sources (PubMed, FDA, ChEMBL,
      # ClinicalTrials, Open Targets, LLM synthesize steps). Starts empty.
      # Mounted at /cache to match SCOUT_CACHE_DIR in .env (and Railway).
      - scout_cache:/cache
      # HuggingFace model cache so BioLORD-2023 downloads once.
      - hf_cache:/hf-cache
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: dami.gupta@gmail.com
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: dami.gupta@gmail.com
      GF_SMTP_FROM_NAME: IndicationScout
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  scout_cache:
  hf_cache:
  prometheus_data:
  grafana_data:
