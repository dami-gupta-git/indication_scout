# Metformin regression spec.
#
# Authored against gold_standard/metformin_2026-09-10_15-01-58.json. Each assertion encodes a
# domain-meaningful invariant a regression must NOT flip.
#
# Anchors are cut from the LATEST run under the current code, not from agreement across runs. The
# grading prompts and gates change often enough that an older snapshot describes different code, so
# intersecting several runs pins whatever survived the changes rather than what is correct now. Each
# anchor below is a paper or trial that is on-point for its indication AND surfaced by the current
# code.
#
# Rank order is not pinned for any indication. No two metformin snapshots have ever ordered the
# sixteen ranked indications the same way, so membership is pinned and position is not.
#
# Candidate-set shift from the prior (2026-08-03) gold: that snapshot pinned NCT00343395 under
# cardiovascular disease. It is a rosiglitazone-AND-metformin trial, and the relevance gate now
# excludes trials where metformin is not the sole studied agent, so it is classified contaminated.
#
# Shift from the 2026-09-08 gold: the per-trial therapeutic-target gate (2026-09-09) moves every
# cardiovascular-disease trial to contaminated (mechanistic endothelial / lipid studies), so no NCT
# is pinned there any more. NCT03717701 (preeclampsia), NCT01799057 (atherosclerosis),
# NCT00005104 / NCT00005654 (PCOS) and NCT00510705 / NCT00723307 (coronary artery disorder) are
# gated out too; the trials pinned below are the ones stable across both 2026-09-10 runs.
#
# Bucket values must match `tests/regression/failure_buckets.Bucket`.

drug: metformin

# Indication naming drifts run to run; resolve the variants to one canonical name so a rename
# upstream isn't read as a coverage regression.
aliases:
  hepatic steatosis:
    - metabolic dysfunction-associated steatotic liver disease
    - non-alcoholic fatty liver disease
  # Only true renames belong here. "coronary artery disorder" is NOT an alias of the broader
  # cardiovascular candidate: both surface in the same report with disjoint trial sets and
  # citations, so aliasing them made the anchor resolve to whichever came first in the report.
  # They are pinned separately below.
  cardiovascular disease:
    - cardiovascular disorder

# Present in the ranked set; exact rank permutes run to run, so no order is pinned.
# Preeclampsia, atherosclerosis and insulin resistance are not pinned in the ranking: they sit at
# the edge of the investigation cap, and a run whose merge keeps gestational diabetes, prediabetes
# and type 1 diabetes as candidates pushes all three out (2026-09-10 20:54). They stay pinned as
# surfaced candidates only.
required_in_ranked:
  - bucket: ranking
    indication: polycystic ovary syndrome
  - bucket: ranking
    indication: hepatic steatosis
  - bucket: ranking
    indication: metabolic syndrome
  - bucket: ranking
    indication: obesity
  - bucket: ranking
    indication: heart failure
  - bucket: ranking
    indication: breast cancer
  - bucket: ranking
    indication: miscarriage

forbidden_in_ranked:
  # Metformin's approved indication. The broad parent stays a surfaced candidate but must never
  # reach the ranking — every paper and trial retrieved for it is on-label use.
  - bucket: demotion_logic
    indication: diabetes mellitus

candidate_set_contains:
  bucket: structural_integrity
  indications:
    - preeclampsia
    - atherosclerosis
    - polycystic ovary syndrome
    - hepatic steatosis
    - obesity
    - breast cancer
    - gestational diabetes
    - prediabetes syndrome
    - diabetes mellitus

# Curated trials the report surfaces (clinical_trials.relevant_nct_ids). Two anchors per disease,
# each surfaced by the latest run.
required_ncts_surfaced:
  - bucket: literature_coverage
    indication: polycystic ovary syndrome
    section: relevant
    ncts:
      - NCT00151411
      - NCT04175964
  - bucket: literature_coverage
    indication: hepatic steatosis
    section: relevant
    ncts:
      - NCT00063232
      - NCT00063635
  - bucket: literature_coverage
    indication: coronary artery disorder
    section: relevant
    ncts:
      - NCT02744976
      - NCT02915198

# Cited PMIDs (evidence_summary supporting + contradicting). Two anchors per disease, each cited in
# both 2026-09-10 runs.
#
# Prevention papers are not pinned: the therapeutic-target gate names the condition the drug is
# given to TREAT, which has no answer for a prevention trial, so PMID 17330831 (preeclampsia
# incidence in PCOS / gestational diabetes) and PMIDs 21411114 / 22892913 (carotid artery
# properties) grade as contaminated.
required_pmids_cited:
  - bucket: literature_coverage
    indication: polycystic ovary syndrome
    mode: cited
    pmids:
      - "10206447"
      - "10634377"
  - bucket: literature_coverage
    indication: hepatic steatosis
    mode: cited
    pmids:
      - "18721166"
      - "19811343"
  - bucket: literature_coverage
    indication: cardiovascular disease
    mode: cited
    pmids:
      - "21205121"
      - "35032305"
  - bucket: literature_coverage
    indication: coronary artery disorder
    mode: cited
    pmids:
      - "24622715"   # 23230096 is now graded contaminated

# Safety — metformin carries black-box warnings (lactic acidosis). Production derives black_box from
# OT; holdout would fall back to serious.
safety_severity:
  - indication: polycystic ovary syndrome
    allowed: [black_box, serious]
  - indication: hepatic steatosis
    allowed: [black_box, serious]
  - indication: cardiovascular disease
    allowed: [black_box, serious]
  - indication: coronary artery disorder
    allowed: [black_box, serious]

# Drug-level collapsed safety signal must surface (empty = collapse regression).
drug_safety:
  summary_present: true
