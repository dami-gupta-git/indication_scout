# Semaglutide regression spec.
#
# Authored against gold_standard/semaglutide_2026-08-03_20-30-07.json. Each
# assertion encodes a domain-meaningful invariant a regression must NOT flip.
#
# Candidate-set shift from the prior (2026-07-18) gold: NCT05669755 (REDEFINE
# 3) was reclassified from relevant to contaminated — it studies CagriSema
# (cagrilintide + semaglutide combination), not semaglutide monotherapy. That
# trial had been propping up "diabetes mellitus" as a top-3 candidate; with it
# correctly excluded, diabetes mellitus no longer surfaces in the top ranks.
# NCT04741074 (kidney transplant candidacy) was also reclassified as
# contaminated — all enrollees have T2DM per inclusion criteria, placing it
# within the approved indication.
#
# Bucket values must match `tests/regression/failure_buckets.Bucket`.

drug: semaglutide

ranked_order:
  bucket: ranking
  indications:
    - cardiovascular disorder
    - kidney disorder

candidate_set_contains:
  bucket: structural_integrity
  indications:
    - cardiovascular disorder
    - kidney disorder
    - parkinson disease
    - metabolic dysfunction-associated steatotic liver disease
    - polycystic ovary syndrome

required_ncts_surfaced:
  - bucket: literature_coverage
    indication: cardiovascular disorder
    section: relevant
    ncts:
      - NCT07483801   # stable across both 07-18 runs
  - bucket: literature_coverage
    indication: kidney disorder
    section: relevant
    ncts:
      - NCT05822609   # stable across both 07-18 runs

required_pmids_cited:
  - bucket: literature_coverage
    indication: cardiovascular disorder
    mode: cited
    pmids:
      - "27633186"
      - "38796653"
  - bucket: literature_coverage
    indication: kidney disorder
    mode: cited
    pmids:
      - "34903039"
      - "38796653"

# Safety — semaglutide carries a black-box warning (thyroid C-cell / MTC risk).
# Production derives black_box from OT; holdout would fall back to serious.
safety_severity:
  - indication: cardiovascular disorder
    allowed: [black_box, serious]
  - indication: kidney disorder
    allowed: [black_box, serious]

# Drug-level collapsed safety signal must surface (empty = collapse regression).
drug_safety:
  summary_present: true
