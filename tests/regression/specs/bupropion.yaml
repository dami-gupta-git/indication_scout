# Bupropion regression spec.
#
# Authored against gold_standard/bupropion_2026-09-10_14-59-56.json. Each assertion encodes a
# domain-meaningful invariant — a fact about bupropion's evidence base that a regression must NOT
# silently flip.
#
# Anchors are pinned where they held across BOTH 2026-09-10 runs (14:52 and 14:59). Only the top
# three are order-pinned; bipolar disorder and neuropathic pain swap ranks 4-5 between the two runs,
# so the rest are pinned present-in-top.
#
# Shift from the 2026-09-08 gold: the per-trial therapeutic-target gate (2026-09-09) and the
# combination-product rule now classify NCT03045341 (naltrexone/bupropion in binge eating) and
# NCT00181896 (bupropion SR for bipolar depression) as contaminated, and binge eating disorder drops
# from #1 to #8 with one relevant trial and one cited paper left. PMIDs 36285406 and 10701483 are no
# longer cited. Anchors below are the survivors.
#
# Dropped anchor: PMID 12842303 was pinned under bipolar disorder from the 19:47 gold. The 22:45 run
# classifies it contaminated and is correct — it is an ADHD trial in patients who also have bipolar
# disorder, so normalizing its endpoint leaves the bipolar diagnosis intact. The elimination test
# added to the synthesis prompt on 2026-09-08 is what now catches it.
#
# Candidate-set shift from the prior (2026-07-18) gold: that snapshot ranked "mood disorder" #2 and
# pinned STEP-BD (NCT00012558) and PMID 2856918 under it. Bupropion is FDA-approved for major
# depressive disorder and seasonal affective disorder, both mood-disorder subtypes, so every paper
# and trial retrieved for the umbrella term is on-label use and the approval gates mark it
# contaminated. The bipolar signal now surfaces under "bipolar disorder", which is not an approved
# use — STEP-BD is pinned there instead.
#
# Bucket values must match `tests/regression/failure_buckets.Bucket`.

drug: bupropion

# Indication naming drifts run to run; resolve the variants to one canonical name so a rename
# upstream isn't read as a coverage regression.
aliases:
  cocaine use disorder:
    - cocaine dependence
    - cocaine abuse
  attention deficit-hyperactivity disorder:
    - attention deficit hyperactivity disorder

# The stable top of the ranking.
ranked_order:
  bucket: ranking
  indications:
    - attention deficit-hyperactivity disorder
    - cocaine use disorder
    - alcohol dependence

# Present in the ranked set; exact rank not pinned.
required_in_ranked:
  - bucket: ranking
    indication: bipolar disorder
  - bucket: ranking
    indication: binge eating disorder
  - bucket: ranking
    indication: neuropathic pain
  - bucket: ranking
    indication: post-traumatic stress disorder
  - bucket: ranking
    indication: parkinson disease

forbidden_in_ranked:
  # Obesity is FDA-approved only as Contrave (bupropion + naltrexone), not bupropion monotherapy —
  # the combination-product rule must keep it out of the ranked signals.
  - bucket: demotion_logic
    indication: obesity disorder
  # Bupropion is approved for major depressive disorder and seasonal affective disorder, so the
  # umbrella "mood disorder" and "depressive disorder" are on-label. Both stay surfaced candidates
  # (see candidate_set_contains) but must never reach the ranking.
  - bucket: demotion_logic
    indication: mood disorder
  - bucket: demotion_logic
    indication: depressive disorder

candidate_set_contains:
  bucket: structural_integrity
  indications:
    - binge eating disorder
    - attention deficit-hyperactivity disorder
    - cocaine use disorder
    - bipolar disorder
    - alcohol dependence
    - mood disorder
    - depressive disorder
    - schizophrenia

# Curated trials the report surfaces (clinical_trials.relevant_nct_ids). Anchors are the trials
# stable across both 2026-09-10 runs.
required_ncts_surfaced:
  - bucket: literature_coverage
    indication: binge eating disorder
    section: relevant
    ncts:
      - NCT00414167   # bupropion monotherapy; the only BED trial that is not a naltrexone combination
  - bucket: literature_coverage
    indication: attention deficit-hyperactivity disorder
    section: relevant
    ncts:
      - NCT00048360   # adult ADHD, Phase 3, completed
      - NCT00936299
  - bucket: literature_coverage
    indication: cocaine use disorder
    section: relevant
    # Regression guard for the MeSH-vocabulary bug: "cocaine use disorder" has no MeSH entry, so an
    # unresolved lookup returns zero trials and the report calls the indication clinical whitespace.
    # These two only surface when the lookup falls back to the "cocaine dependence" synonym.
    ncts:
      - NCT02111798
      - NCT00000276
  - bucket: literature_coverage
    indication: bipolar disorder
    section: relevant
    ncts:
      - NCT00012558   # STEP-BD, bipolar disorder, completed

# Cited PMIDs (evidence_summary supporting + contradicting). Anchors are the citations stable across
# both 2026-09-10 runs.
required_pmids_cited:
  - bucket: literature_coverage
    indication: binge eating disorder
    mode: cited
    pmids:
      - "23656848"
  - bucket: literature_coverage
    indication: attention deficit-hyperactivity disorder
    mode: cited
    pmids:
      - "11156812"   # adult ADHD RCT, bupropion SR
      - "11916368"
  - bucket: literature_coverage
    indication: cocaine use disorder
    mode: cited
    # The merge step names this candidate "cocaine use disorder" or "cocaine dependence" from run to
    # run; the name drives the literature query, so the shortlist and citations churn with it. Any
    # one of these three (the 2023 RCT, the 2019 meta-analysis, the 2019 review) is enough.
    min_present: 1
    pmids:
      - "36920397"
      - "31183685"
      - "30815171"
  - bucket: literature_coverage
    indication: bipolar disorder
    mode: cited
    pmids:
      - "7929019"
      - "16880481"

# Safety — bupropion carries black-box warnings (psychiatric / cardiotoxicity). Production derives
# black_box from OT warnings; holdout (OT suppressed) would pick serious from pre-cutoff literature,
# hence the allowed set.
safety_severity:
  - indication: binge eating disorder
    allowed: [black_box, serious]
  - indication: attention deficit-hyperactivity disorder
    allowed: [black_box, serious]
  - indication: cocaine use disorder
    allowed: [black_box, serious]
  - indication: bipolar disorder
    allowed: [black_box, serious]

# Disease-specific harm flag — the indication-scoped literature reports a harm for bupropion in each
# of these contexts. The ADHD pin was dropped on 2026-09-10: the per-paper harm judge grades PMID
# 15705013 (blood pressure and heart rate rises vs baseline) as "safety_assessed_only".
indication_harm:
  - indication: cocaine use disorder
    expected: true
  - indication: bipolar disorder
    expected: true

# Drug-level collapsed safety signal must surface (empty = collapse regression).
drug_safety:
  summary_present: true
