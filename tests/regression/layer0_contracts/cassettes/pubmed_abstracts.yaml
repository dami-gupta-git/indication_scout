        CitedMedium="Internet"><Volume>55</Volume><Issue>6</Issue><PubDate><Year>2024</Year><Month>Dec</Month></PubDate></JournalIssue><Title>Journal
        of molecular histology</Title><ISOAbbreviation>J Mol Histol</ISOAbbreviation></Journal><ArticleTitle>Metformin
        protects against small intestine damage induced by diabetes and dunning''s
        prostate cancer: A biochemical and histological study.</ArticleTitle><Pagination><StartPage>1093</StartPage><EndPage>1105</EndPage><MedlinePgn>1093-1105</MedlinePgn></Pagination><ELocationID
        EIdType="doi" ValidYN="Y">10.1007/s10735-024-10252-y</ELocationID><Abstract><AbstractText>The
        oral biguanide metformin is used to treat type 2 diabetic mellitus (T2DM).
        Anti-cancer effects have been proven by metformin in different hormone-sensitive
        tumors, including breast, pancreatic, colon, and prostate cancer. Therefore,
        we investigated whether metformin could defend against small intestine damage
        in Dunning''s prostate cancer. The study divided the six groups of male Copenhagen
        rats into the following categories: control, diabetic (D), cancer (C), diabetic&#x2009;+&#x2009;cancer
        (DC), cancer&#x2009;+&#x2009;metformin (CM), and diabetic&#x2009;+&#x2009;cancer&#x2009;+&#x2009;metformin
        (DCM). After sacrifice, the small intestines were removed to assess biochemical
        markers and histopathological evaluation. Biochemical evaluations showed that
        glutathione (reduced) levels and other enzyme activities related antioxidant
        systems, paraoxonase, sodium potassium ATPase, acetylcholinesterase activities
        were decreased. In contrast, lipid peroxidation, total oxidant status, reactive
        oxygen species, interleukin-1&#x3b2;, interleukin-6, tumor necrosis factor-&#x3b1;,
        sucrase, maltase, trypsin, myeloperoxidase, xanthine oxidase activities, protein
        carbonyl contents and sialic acid levels were raised in the damaged groups.
        Treatment with metformin restored all of this. The histological assessment
        revealed moderate to severe damage in the small intestine following processes
        D and C. According to the study''s findings, metformin treatment led to a
        notable decline in histopathological damage in the C and DC. A slight lowering
        in inflammatory cells and an improvement in the damaged gland integrity in
        the small intestine were noted with metformin treatment.&#x200b; Metformin
        use protected the small intestinal tissue damage and decreased oxidative stress.</AbstractText><CopyrightInformation>&#xa9;
        2024. The Author(s), under exclusive licence to Springer Nature B.V.</CopyrightInformation></Abstract><AuthorList
