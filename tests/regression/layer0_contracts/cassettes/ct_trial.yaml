        Cirrhosis (F4) Due to Nonalcoholic Steatohepatitis (NASH)\",\"acronym\":\"WAYFIND\"},\"statusModule\":{\"statusVerifiedDate\":\"2025-11\",\"overallStatus\":\"COMPLETED\",\"expandedAccessInfo\":{\"hasExpandedAccess\":false},\"startDateStruct\":{\"date\":\"2021-08-09\",\"type\":\"ACTUAL\"},\"primaryCompletionDateStruct\":{\"date\":\"2024-11-12\",\"type\":\"ACTUAL\"},\"completionDateStruct\":{\"date\":\"2024-12-09\",\"type\":\"ACTUAL\"},\"studyFirstSubmitDate\":\"2021-07-20\",\"studyFirstSubmitQcDate\":\"2021-07-20\",\"studyFirstPostDateStruct\":{\"date\":\"2021-07-21\",\"type\":\"ACTUAL\"},\"resultsFirstSubmitDate\":\"2025-11-12\",\"resultsFirstSubmitQcDate\":\"2025-11-12\",\"resultsFirstPostDateStruct\":{\"date\":\"2025-11-26\",\"type\":\"ACTUAL\"},\"lastUpdateSubmitDate\":\"2025-11-12\",\"lastUpdatePostDateStruct\":{\"date\":\"2025-11-26\",\"type\":\"ACTUAL\"}},\"sponsorCollaboratorsModule\":{\"responsibleParty\":{\"type\":\"SPONSOR\"},\"leadSponsor\":{\"name\":\"Gilead
        Sciences\",\"class\":\"INDUSTRY\"},\"collaborators\":[{\"name\":\"Novo Nordisk
        A/S\",\"class\":\"INDUSTRY\"}]},\"oversightModule\":{\"oversightHasDmc\":true,\"isFdaRegulatedDrug\":true,\"isFdaRegulatedDevice\":false},\"descriptionModule\":{\"briefSummary\":\"The
        goal of this clinical study is to understand whether the study drugs, semaglutide
        (SEMA) with the fixed-dose combination (FDC) of cilofexor/firsocostat (CILO/FIR),
        cause fibrosis improvement and Nonalcoholic Steatohepatitis (NASH) resolution
        in participants with cirrhosis due to NASH.\"},\"conditionsModule\":{\"conditions\":[\"Nonalcoholic
        Steatohepatitis\"]},\"designModule\":{\"studyType\":\"INTERVENTIONAL\",\"phases\":[\"PHASE2\"],\"designInfo\":{\"allocation\":\"RANDOMIZED\",\"interventionModel\":\"PARALLEL\",\"primaryPurpose\":\"TREATMENT\",\"maskingInfo\":{\"masking\":\"DOUBLE\",\"whoMasked\":[\"PARTICIPANT\",\"INVESTIGATOR\"]}},\"enrollmentInfo\":{\"count\":457,\"type\":\"ACTUAL\"}},\"armsInterventionsModule\":{\"armGroups\":[{\"label\":\"SEMA
        + CILO/FIR FDC\",\"type\":\"EXPERIMENTAL\",\"description\":\"Participants
        will receive semaglutide (SEMA) 3.0 mg/mL, once weekly and cilofexor and firsocostat
        (CILO/FIR) 30 mg/20 mg fixed-dose combination (FDC) tablet, once daily up
        to 72 weeks.\",\"interventionNames\":[\"Drug: Semaglutide (SEMA)\",\"Drug:
        Cilofexor (CILO)/Firsocostat (FIR)\"]},{\"label\":\"SEMA + PTM CILO/FIR\",\"type\":\"EXPERIMENTAL\",\"description\":\"Participants
        will receive SEMA 3.0 mg/mL, once weekly and Placebo-To-Match (PTM) CILO/FIR
        FDC tablet, once daily up to 72 weeks.\",\"interventionNames\":[\"Drug: Semaglutide
        (SEMA)\",\"Drug: PTM CILO/FIR\"]},{\"label\":\"PTM SEMA + CILO/FIR FDC\",\"type\":\"EXPERIMENTAL\",\"description\":\"Participants
        will receive PTM SEMA, once weekly and CILO/FIR 30 mg/20 mg FDC tablet, once
        daily up to 72 weeks.\",\"interventionNames\":[\"Drug: Cilofexor (CILO)/Firsocostat
        (FIR)\",\"Drug: PTM SEMA\"]},{\"label\":\"PTM SEMA + PTM CILO/FIR\",\"type\":\"PLACEBO_COMPARATOR\",\"description\":\"Participants
        will receive PTM SEMA, once weekly and PTM CILO/FIR FDC tablet, once daily
        up to 72 weeks.\",\"interventionNames\":[\"Drug: PTM SEMA\",\"Drug: PTM CILO/FIR\"]}],\"interventions\":[{\"type\":\"DRUG\",\"name\":\"Semaglutide
        (SEMA)\",\"description\":\"Administered as subcutaneous (SC) injection\",\"armGroupLabels\":[\"SEMA
        + CILO/FIR FDC\",\"SEMA + PTM CILO/FIR\"]},{\"type\":\"DRUG\",\"name\":\"Cilofexor
        (CILO)/Firsocostat (FIR)\",\"description\":\"Tablets administered orally\",\"armGroupLabels\":[\"PTM
        SEMA + CILO/FIR FDC\",\"SEMA + CILO/FIR FDC\"],\"otherNames\":[\"GS-9674/GS-0976\"]},{\"type\":\"DRUG\",\"name\":\"PTM
        SEMA\",\"description\":\"Administered as SC injection\",\"armGroupLabels\":[\"PTM
        SEMA + CILO/FIR FDC\",\"PTM SEMA + PTM CILO/FIR\"]},{\"type\":\"DRUG\",\"name\":\"PTM
        CILO/FIR\",\"description\":\"Tablets administered orally\",\"armGroupLabels\":[\"PTM
        SEMA + PTM CILO/FIR\",\"SEMA + PTM CILO/FIR\"]}]},\"outcomesModule\":{\"primaryOutcomes\":[{\"measure\":\"Percentage
        of Participants Who Achieved \u2265 1-Stage Improvement in Fibrosis Without
        Worsening of Nonalcoholic Steatohepatitis (NASH) at Week 72 in Semaglutide
        (SEMA) + Cilofexor/Firsocostat (CILO/FIR) Fixed Dose Combination (FDC) Versus
        Placebo Groups\",\"description\":\"Fibrosis improvement was defined as \u2265
        1-stage decrease from baseline in fibrosis according to the NASH clinical
        research network (CRN) classification. Worsening of NASH was defined as \u2265
        1-point increase from baseline in hepatocellular ballooning or lobular inflammation.\\n\\nClopper-Pearson
        method was used in outcome measure analysis in each arm. Percentages were
        rounded-off.\",\"timeFrame\":\"Week 72\"}],\"secondaryOutcomes\":[{\"measure\":\"Percentage
        of Participants Who Achieved \u22651-Stage Improvement in Fibrosis Without
        Worsening of NASH at Week 72 in SEMA + CILO/FIR FDC Versus SEMA Alone\",\"description\":\"Fibrosis
        improvement was defined as \u2265 1-stage decrease from baseline in fibrosis
        according to the NASH CRN classification. Worsening of NASH was defined as
        \u2265 1-point increase from baseline in hepatocellular ballooning or lobular
        inflammation.\\n\\nClopper-Pearson method was used in outcome measure analysis
        in each arm. Percentages were rounded-off.\",\"timeFrame\":\"Week 72\"},{\"measure\":\"Percentage
        of Participants With NASH Resolution Without Worsening in Fibrosis at Week
        72 in SEMA + CILO/FIR FDC Versus Placebo Groups\",\"description\":\"NASH resolution
        is defined as lobular inflammation of 0 or 1 and hepatocellular ballooning
        of 0. Worsening in fibrosis was defined as a change in fibrosis worsening
        stage as per NASH CRN criteria.\\n\\nClopper-Pearson method was used in outcome
        measure analysis in each arm. Percentages were rounded-off.\",\"timeFrame\":\"Week
        72\"},{\"measure\":\"Percentage of Participants With NASH Resolution Without
        Worsening in Fibrosis In Participants Treated With SEMA + CILO/FIR FDC Versus
        CILO/FIR Alone Groups\",\"description\":\"NASH resolution is defined as lobular
        inflammation of 0 or 1 and hepatocellular ballooning of 0. Worsening in fibrosis
        was defined as a change in fibrosis worsening stage as per NASH CRN criteria.\\n\\nClopper-Pearson
        method was used in outcome measure analysis in each arm. Percentages were
        rounded-off.\",\"timeFrame\":\"Week 72\"}]},\"eligibilityModule\":{\"eligibilityCriteria\":\"Key
        Inclusion Criteria:\\n\\n* Liver biopsy consistent with cirrhosis (F4) due
        to nonalcoholic steatohepatitis (NASH) in the opinion of the central reader.
        In individuals who have never had a liver biopsy, a screening liver biopsy
        may be performed.\\n* Screening laboratory parameters as determined by the
        study central laboratory:\\n\\n  * Estimated glomerular filtration rate (eGFR)
        \u2265 30 mL/min/1.73 m\\\\^2, as calculated by the Modification of Diet in
        Renal Disease (MDRD) equation.\\n  * Hemoglobin A1c (HbA1c) \u2264 10%\\n
        \ * International normalized ratio (INR) \u2264 1.4, unless due to therapeutic
        anticoagulation\\n  * Platelet count \u2265 125,000/\xB5L\\n  * Alanine aminotransferase
        (ALT) \\\\< 5 x upper limit of normal (ULN)\\n  * Serum albumin \u2265 3.5
        g/dL\\n  * Serum alkaline phosphatase (ALP) \u2264 2 x ULN\\n* Body mass index
        (BMI) \u2265 23 kg/m\\\\^2 at screening.\\n\\nKey Exclusion Criteria:\\n\\n*
        Prior history of decompensated liver disease, including ascites, hepatic encephalopathy
        (HE), or variceal bleeding.\\n* Child-Pugh (CP) score \\\\> 6 at screening,
        unless due to an alternative etiology such as Gilbert's syndrome or therapeutic
        anticoagulation.\\n* Model for End-stage Liver Disease (MELD) score \\\\>
        12 at screening, unless due to an alternative etiology such as therapeutic
        anticoagulation.\\n* Other causes of liver disease based on medical history
        and/or central reader review of liver histology, including but not limited
        to: alcoholic liver disease, autoimmune disorders (eg, primary biliary cholangitis,
        primary sclerosing cholangitis, autoimmune hepatitis), drug-induced hepatotoxicity,
        Wilson disease, clinically significant iron overload, or alpha-1-antitrypsin
        deficiency.\\n* Chronic hepatitis B virus (HBV) infection (HBsAg positive),
        or Chronic hepatitis C virus (HCV) infection (HCV antibody and HCV ribonucleic
        acid (RNA) positive). Individuals cured of HCV infection less than 2 years
        prior to the screening visit are not eligible.\\n* History of liver transplantation.\\n*
        Current or prior history of hepatocellular carcinoma (HCC).\\n* Men who habitually
        drink greater than 21 units/week of alcohol or women who habitually drink
        greater than 14 units/week of alcohol (1 unit is equivalent to 12 ounce (oz)/360
        mL of beer, a 4 oz/120 mL glass of wine, or 1 oz/30 mL of hard liquor).\\n\\n
        \ * For individuals on vitamin E regimen \u2265 800 IU/day, or pioglitazone,
        dose must be stable, in the opinion of the investigator for at least 180 days
        prior to the historical or screening liver biopsy.\\n  * For individuals on
        medications for diabetes, dose must be stable, in the opinion of the investigator,
        for at least 90 days prior to the historical or screening liver biopsy.\\n*
        History of type 1 diabetes.\\n* Treatment with a glucagon-like peptide-1 receptor
        agonist (GLP-1 RA) in the period from 90 days prior to the screening visit
        and for individuals with a qualifying historical liver biopsy, for 90 days
        prior to the date of the historical liver biopsy.\\n* For individuals who
        have not completed a series of an authorized coronavirus disease 2019 (COVID-19)
        vaccination regimen prior to screening, a positive result for COVID-19 on
        severe acute respiratory syndrome (SARS)-coronavirus 2 (CoV-2) reverse transcriptase-polymerase
        chain reaction (RT-PCR) test.\\n\\nNote: Other protocol defined Inclusion/Exclusion
        criteria may apply.\",\"healthyVolunteers\":false,\"sex\":\"ALL\",\"minimumAge\":\"18
