name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Settings load from .env; the example file supplies placeholder values so
      # unit tests (which never call external services) can construct Settings.
      - name: Provide env file
        run: cp .env.example .env

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: black --check src/ tests/

      - name: Unit tests
        run: pytest tests/unit/
