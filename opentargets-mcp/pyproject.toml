[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentargets-mcp"
version = "0.1.0"
description = "MCP server exposing Open Targets Platform lookups as interactive tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Dhruv Gupta" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24.0"]

[project.scripts]
opentargets-mcp = "opentargets_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real Open Targets API"]
addopts = "-m 'not live'"

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
