apiVersion: 1

muteTimes:
  - orgId: 1
    name: indication-scout-display-only
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"
        location: UTC

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: grafana-default-email
        object_matchers:
          - - service
            - "="
            - indication-scout
        mute_time_intervals:
          - indication-scout-display-only

groups:
  - orgId: 1
    name: IndicationScout analysis alerts
    folder: IndicationScout
    interval: 10s
    rules:
      - uid: scout-analysis-over-ten-minutes
        title: Analysis active longer than 2 minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: indication-scout-prometheus
            model:
              datasource:
                type: prometheus
                uid: indication-scout-prometheus
              editorMode: code
              expr: >-
                max((time() - indication_scout_analysis_oldest_active_start_time_seconds)
                and on (submission_source, execution_mode)
                (indication_scout_active_analyses > 0))
              instant: true
              intervalMs: 10000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 120
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        dashboardUid: indication-scout-service
        panelId: 5
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: An API analysis has remained active for more than two minutes.
        labels:
          service: indication-scout
          severity: warning

      - uid: scout-report-integrity-rejection
        title: Report integrity rejection
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: indication-scout-prometheus
            model:
              datasource:
                type: prometheus
                uid: indication-scout-prometheus
              editorMode: code
              expr: >-
                sum(increase(indication_scout_report_integrity_rejections_total[5m]))
              instant: true
              intervalMs: 10000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        dashboardUid: indication-scout-service
        panelId: 8
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A report was rejected by deterministic integrity validation.
        labels:
          service: indication-scout
          severity: critical

      - uid: scout-api-availability-budget-burn
        title: API availability error budget burning quickly
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: indication-scout-prometheus
            model:
              datasource:
                type: prometheus
                uid: indication-scout-prometheus
              editorMode: code
              expr: >-
                (1 - avg_over_time(up{job="indication-scout"}[1h])) / 0.05
              instant: true
              intervalMs: 10000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 2
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        dashboardUid: indication-scout-service-levels
        panelId: 4
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: API errors are consuming the 24-hour availability budget at more than twice its sustainable rate.
        labels:
          service: indication-scout
          severity: warning

      - uid: scout-analysis-success-budget-burn
        title: Analysis success error budget burning quickly
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: indication-scout-prometheus
            model:
              datasource:
                type: prometheus
                uid: indication-scout-prometheus
              editorMode: code
              expr: >-
                (sum(increase(indication_scout_analysis_runs_total{submission_source="api",execution_mode="live",outcome=~"error|interrupted"}[6h]))
                / sum(increase(indication_scout_analysis_runs_total{submission_source="api",execution_mode="live",outcome=~"done|error|interrupted"}[6h])))
                / 0.20
              instant: true
              intervalMs: 10000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 2
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        dashboardUid: indication-scout-service-levels
        panelId: 5
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Failed analyses are consuming the 24-hour success budget at more than twice its sustainable rate.
        labels:
          service: indication-scout
          severity: warning

      - uid: scout-analysis-latency-budget-burn
        title: Analysis latency error budget burning quickly
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: indication-scout-prometheus
            model:
              datasource:
                type: prometheus
                uid: indication-scout-prometheus
              editorMode: code
              expr: >-
                ((sum(increase(indication_scout_analysis_slo_duration_seconds_count{submission_source="api",execution_mode="live",outcome="done"}[6h]))
                - sum(increase(indication_scout_analysis_slo_duration_seconds_bucket{submission_source="api",execution_mode="live",outcome="done",le="900.0"}[6h])))
                / sum(increase(indication_scout_analysis_slo_duration_seconds_count{submission_source="api",execution_mode="live",outcome="done"}[6h])))
                / 0.20
              instant: true
              intervalMs: 10000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 2
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        dashboardUid: indication-scout-service-levels
        panelId: 6
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Slow analyses are consuming the 24-hour latency budget at more than twice its sustainable rate.
        labels:
          service: indication-scout
          severity: warning
