apiVersion: 1

groups:
  - orgId: 1
    name: IndicationScout analysis alerts
    folder: IndicationScout
    interval: 10s
    rules:
      - uid: scout-analysis-over-ten-minutes
        title: Analysis active longer than 10 minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: indication-scout-prometheus
            model:
              datasource:
                type: prometheus
                uid: indication-scout-prometheus
              editorMode: code
              expr: >-
                max((time() - indication_scout_analysis_oldest_active_start_time_seconds)
                and on (submission_source, execution_mode)
                (indication_scout_active_analyses > 0))
              instant: true
              intervalMs: 10000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 600
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        dashboardUid: indication-scout-service
        panelId: 5
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: An API analysis has remained active for more than ten minutes.
        labels:
          service: indication-scout
          severity: warning

      - uid: scout-report-integrity-rejection
        title: Report integrity rejection
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: indication-scout-prometheus
            model:
              datasource:
                type: prometheus
                uid: indication-scout-prometheus
              editorMode: code
              expr: >-
                sum(increase(indication_scout_report_integrity_rejections_total[5m]))
              instant: true
              intervalMs: 10000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        dashboardUid: indication-scout-service
        panelId: 8
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A report was rejected by deterministic integrity validation.
        labels:
          service: indication-scout
          severity: critical
